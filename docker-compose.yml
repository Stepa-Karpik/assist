services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-karpik}
      POSTGRES_USER: ${POSTGRES_USER:-karpik}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-karpik}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-karpik} -d ${POSTGRES_DB:-karpik}"]
      interval: 5s
      timeout: 5s
      retries: 20

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      KARPIK_ENV: production
      KARPIK_DATABASE_URL: postgresql://${POSTGRES_USER:-karpik}:${POSTGRES_PASSWORD:-karpik}@postgres:5432/${POSTGRES_DB:-karpik}
      KARPIK_DATABASE_CONNECT_TIMEOUT: ${KARPIK_DATABASE_CONNECT_TIMEOUT:-5}
      KARPIK_API_PREFIX: /api
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health').read()\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 12

  bot:
    build:
      context: .
      dockerfile: bot/Dockerfile
    profiles: ["telegram"]
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    environment:
      KARPIK_TELEGRAM_TOKEN: ${KARPIK_TELEGRAM_TOKEN}
      KARPIK_BOT_NAME: ${KARPIK_BOT_NAME:-Karpik}
      KARPIK_SERVER_URL: http://server:8000
      KARPIK_DEVICE_ID: ${KARPIK_DEVICE_ID:-desktop-local}
      KARPIK_PAIR_WAIT_SECONDS: ${KARPIK_PAIR_WAIT_SECONDS:-5}
      KARPIK_AUTH_WAIT_SECONDS: ${KARPIK_AUTH_WAIT_SECONDS:-5}
      KARPIK_DELIVERY_POLL_SECONDS: ${KARPIK_DELIVERY_POLL_SECONDS:-2}

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "${KARPIK_HTTP_PORT:-8080}:80"
    volumes:
      - ./infra/nginx/karpik.conf:/etc/nginx/conf.d/default.conf:ro
      - ${KARPIK_UPDATE_FEED_HOST_PATH:-./desktop/out/make/squirrel.windows/x64}:/usr/share/nginx/html/desktop-updates/win32/x64:ro

volumes:
  postgres-data:
